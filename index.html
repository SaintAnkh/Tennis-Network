<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:0 auto;padding:16px;background:#f4f7f4;color:#222}
h1{color:#2d6a2d}h2{margin-top:28px}
table{width:100%;border-collapse:collapse;background:#fff}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
input,select,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
button{background:#2d6a2d;color:#fff;border:0;border-radius:6px}
.box{background:#fff;padding:12px;border-radius:8px;margin-top:8px}
small{color:#666}
</style></head><body>
<h1>🎾 Tennis Network</h1>
<small>Win points = 10 + 5 × rank gap</small>

<h2>Standings</h2><table id="st"></table>
<div id="pv"></div>
<h2>Recent matches</h2><table id="mt"></table>

<h2>Crew login</h2>
<div class="box" id="auth"></div>
<div id="crew" style="display:none">
  <div id="pend"></div><h2>Report a result</h2>
  <div class="box">
    <select id="w"></select><select id="l"></select>
    <input id="sc" placeholder="Score (e.g. 6-4 6-3)">
    <button onclick="report()">Submit result</button>
  </div>
  <h2>Add player</h2>
  <div class="box">
    <input id="np" placeholder="Player name">
    <button onclick="addPlayer()">Add</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://dnelocfzgwikfsmzhedn.supabase.co";
const SUPABASE_KEY="sb_publishable_Hx1S93WXdyooJur6TXCjMw_twp-9PGR";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let players=[],matches=[],pending=[],session=null;
const ADMIN="agadaorders@gmail.com";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function standings(){
  const pts={};players.forEach(p=>pts[p.id]=0);
  matches.forEach(m=>{if(m.winner_id in pts)pts[m.winner_id]+=m.points_awarded});
  return players.map(p=>({...p,pts:pts[p.id]}))
    .sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
}
async function load(){
  const p=await sb.from("players").select("*");
  const m=await sb.from("matches").select("*").order("id",{ascending:false});
  players=p.data||[];const all=m.data||[];
matches=all.filter(x=>x.status==="approved");
pending=all.filter(x=>x.status==="pending");
render();renderPending();
}
function render(){
  const s=standings(),name=id=>(players.find(p=>p.id===id)||{}).name;
  $("st").innerHTML="<tr><th>#</th><th>Player</th><th>Pts</th></tr>"+
    s.map((p,i)=>`<tr><td>${i+1}</td><td><a href="#" onclick="showPlayer(${p.id});return false">${esc(p.name)}</a></td><td>${p.pts}</td></tr>`).join("");
  $("mt").innerHTML=matches.slice(0,15).map(m=>
    `<tr><td>${esc(name(m.winner_id))} beat ${esc(name(m.loser_id))}<br><small>${esc(m.score)} · ${m.played_on}</small></td><td>+${m.points_awarded}</td></tr>`).join("")
    ||"<tr><td>No matches yet</td></tr>";
  const opts=s.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("w").innerHTML='<option value="">Winner…</option>'+opts;
  $("l").innerHTML='<option value="">Loser…</option>'+opts;
}
async function report(){
  const w=+$("w").value,l=+$("l").value;
  if(!w||!l||w===l)return alert("Pick two different players");
  const {error}=await sb.from("matches").insert({winner_id:w,loser_id:l,score:$("sc").value,status:"pending"});
  if(error)return alert(error.message);
  $("sc").value="";alert("Submitted! It will count once approved.");load();
}
async function approve(id){
  const m=pending.find(x=>x.id===id),s=standings();
  const rw=s.findIndex(p=>p.id===m.winner_id)+1,rl=s.findIndex(p=>p.id===m.loser_id)+1;
  const pts=rw>rl?10+5*(rw-rl):10;
  const {error}=await sb.from("matches").update({status:"approved",winner_rank:rw,loser_rank:rl,points_awarded:pts}).eq("id",id);
  if(error)return alert(error.message);load();
}
async function reject(id){
  if(!confirm("Reject this result?"))return;
  const {error}=await sb.from("matches").delete().eq("id",id);
  if(error)return alert(error.message);load();
}
function renderPending(){
  const el=$("pend");
  if(!session||session.user.email.toLowerCase()!==ADMIN){el.innerHTML="";return;}
  const name=id=>(players.find(p=>p.id===id)||{}).name;
  el.innerHTML=pending.length?"<h2>Pending approval</h2>"+pending.map(m=>
    `<div class="box">${esc(name(m.winner_id))} beat ${esc(name(m.loser_id))}<br><small>${esc(m.score)} · ${m.played_on}</small>
    <button onclick="approve(${m.id})">Approve</button>
    <button onclick="reject(${m.id})" style="background:#a33">Reject</button></div>`).join(""):"";
}
async function addPlayer(){
  const n=$("np").value.trim();if(!n)return;
  const {error}=await sb.from("players").insert({name:n});
  if(error)return alert(error.message);
  $("np").value="";load();
}
function renderAuth(){
  $("crew").style.display=session?"block":"none";
  $("auth").innerHTML=session
    ?`Signed in as ${esc(session.user.email)}<button onclick="sb.auth.signOut()">Sign out</button>`
    :`<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ chars)">
      <button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button>`;
}
async function signIn(){
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error)alert(error.message);
}
async function signUp(){
  const {error}=await sb.auth.signUp({email:$("em").value,password:$("pw").value});
  alert(error?error.message:"Account created. Check your email to confirm, then sign in.");
}
  function showPlayer(id){
  const s=standings(),i=s.findIndex(p=>p.id===id);
  if(i<0){$("pv").innerHTML="";return;}
  const p=s[i],name=x=>(players.find(q=>q.id===x)||{}).name;
  const mine=matches.filter(m=>m.winner_id===id||m.loser_id===id);
  const w=mine.filter(m=>m.winner_id===id).length;
  $("pv").innerHTML=`<div class="box"><b>${esc(p.name)}</b> · Rank #${i+1} · ${p.pts} pts<br><small>${w} wins, ${mine.length-w} losses</small>
  <table>${mine.map(m=>{const win=m.winner_id===id;
  return `<tr><td>${win?"✅ Beat":"❌ Lost to"} ${esc(name(win?m.loser_id:m.winner_id))}<br><small>${esc(m.score)} · ${m.played_on}</small></td><td>${win?"+"+m.points_awarded:"0"}</td></tr>`}).join("")||"<tr><td>No matches yet</td></tr>"}</table>
  <button onclick="$('pv').innerHTML=''">Close</button></div>`;
  $("pv").scrollIntoView({behavior:"smooth"});
}
sb.auth.onAuthStateChange((_e,s)=>{session=s;renderAuth();load()});
sb.auth.getSession().then(({data})=>{session=data.session;renderAuth()});
load();
</script></body></html>
