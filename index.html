<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Network</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:600px;margin:0 auto;padding:16px;background:#f4f7f4;color:#222}
h1{color:#2d6a2d}h2{margin-top:28px}
table{width:100%;border-collapse:collapse;background:#fff}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
input,select,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box}
button{background:#2d6a2d;color:#fff;border:0;border-radius:6px}
.box{background:#fff;padding:12px;border-radius:8px;margin-top:8px}
small{color:#666}
</style></head><body>
<h1>🎾 Tennis Ladder</h1>
<small>Win points = 10 + 5 × rank gap</small>

<h2>Standings</h2><table id="st"></table>
<h2>Recent matches</h2><table id="mt"></table>

<h2>Crew login</h2>
<div class="box" id="auth"></div>
<div id="crew" style="display:none">
  <h2>Report a result</h2>
  <div class="box">
    <select id="w"></select><select id="l"></select>
    <input id="sc" placeholder="Score (e.g. 6-4 6-3)">
    <button onclick="report()">Submit result</button>
  </div>
  <h2>Add player</h2>
  <div class="box">
    <input id="np" placeholder="Player name">
    <button onclick="addPlayer()">Add</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://dnelocfzgwikfsmzhedn.supabase.co";
const SUPABASE_KEY="sb_publishable_Hx1S93WXdyooJur6TXCjMw_twp-9PGR";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let players=[],matches=[],session=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function standings(){
  const pts={};players.forEach(p=>pts[p.id]=0);
  matches.forEach(m=>{if(m.winner_id in pts)pts[m.winner_id]+=m.points_awarded});
  return players.map(p=>({...p,pts:pts[p.id]}))
    .sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
}
async function load(){
  const p=await sb.from("players").select("*");
  const m=await sb.from("matches").select("*").order("id",{ascending:false});
  players=p.data||[];matches=m.data||[];render();
}
function render(){
  const s=standings(),name=id=>(players.find(p=>p.id===id)||{}).name;
  $("st").innerHTML="<tr><th>#</th><th>Player</th><th>Pts</th></tr>"+
    s.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.pts}</td></tr>`).join("");
  $("mt").innerHTML=matches.slice(0,15).map(m=>
    `<tr><td>${esc(name(m.winner_id))} beat ${esc(name(m.loser_id))}<br><small>${esc(m.score)} · ${m.played_on}</small></td><td>+${m.points_awarded}</td></tr>`).join("")
    ||"<tr><td>No matches yet</td></tr>";
  const opts=s.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  $("w").innerHTML='<option value="">Winner…</option>'+opts;
  $("l").innerHTML='<option value="">Loser…</option>'+opts;
}
async function report(){
  const w=+$("w").value,l=+$("l").value;
  if(!w||!l||w===l)return alert("Pick two different players");
  const s=standings();
  const rw=s.findIndex(p=>p.id===w)+1,rl=s.findIndex(p=>p.id===l)+1;
  const pts=10+5*Math.abs(rw-rl);
  const {error}=await sb.from("matches").insert({winner_id:w,loser_id:l,score:$("sc").value,
    winner_rank:rw,loser_rank:rl,points_awarded:pts});
  if(error)return alert(error.message);
  $("sc").value="";load();
}
async function addPlayer(){
  const n=$("np").value.trim();if(!n)return;
  const {error}=await sb.from("players").insert({name:n});
  if(error)return alert(error.message);
  $("np").value="";load();
}
function renderAuth(){
  $("crew").style.display=session?"block":"none";
  $("auth").innerHTML=session
    ?`Signed in as ${esc(session.user.email)}<button onclick="sb.auth.signOut()">Sign out</button>`
    :`<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ chars)">
      <button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button>`;
}
async function signIn(){
  const {error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error)alert(error.message);
}
async function signUp(){
  const {error}=await sb.auth.signUp({email:$("em").value,password:$("pw").value});
  alert(error?error.message:"Account created. Check your email to confirm, then sign in.");
}
sb.auth.onAuthStateChange((_e,s)=>{session=s;renderAuth()});
sb.auth.getSession().then(({data})=>{session=data.session;renderAuth()});
load();
</script></body></html>
